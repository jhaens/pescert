[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pescert"
version = "0.1.0"
description = "Reference-free certification proxies for machine-learning interatomic potentials (MLIPs)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonas Hänseroth", email = "jonas.haenseroth@tu-ilmenau.de"}]
keywords = ["MLIP", "interatomic-potential", "evaluation", "evals","ML", "benchmark", "physics", "ASE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "ase>=3.22",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
pescert = "pescert.cli:main"

[project.urls]
Homepage = "https://jhaens.github.io/pescert-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E741"]  # allow short physics variable names (l, etc.)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]